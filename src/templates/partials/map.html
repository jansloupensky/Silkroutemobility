<figure class="map">
  <!-- Stylizovaná mapa (bez iframe a bez cookies). Pin je vždy uprostřed, souřadnice ze site.json. -->
  <svg class="map__svg" viewBox="0 0 800 500" role="img" aria-label="${e(t.common.mapAlt)}" preserveAspectRatio="xMidYMid slice">
    <rect width="800" height="500" class="map__bg"/>
    <g class="map__blocks">
      <path d="M0 60 L250 20 L330 140 L120 210 L0 190Z"/>
      <path d="M470 0 H800 V150 L560 230 L450 120Z"/>
      <path d="M0 330 L170 280 L300 360 L250 500 H0Z"/>
      <path d="M520 330 L800 270 V500 H560Z"/>
    </g>
    <path class="map__river" d="M-20 410 C120 380 200 300 330 300 S 520 360 610 250 S 720 90 830 70"/>
    <g class="map__roads">
      <path d="M0 250 H800"/>
      <path d="M400 0 V500"/>
      <path d="M90 0 L330 500"/>
      <path d="M800 120 L250 470"/>
    </g>
    <g class="map__streets">
      <path d="M0 140 L800 330"/><path d="M180 0 L140 500"/><path d="M620 0 L700 500"/>
      <path d="M0 420 L800 410"/><path d="M0 80 L800 40"/><path d="M520 0 L470 500"/>
      <path d="M270 0 L300 500"/><path d="M0 330 L400 180"/>
    </g>
    <g class="map__pin" transform="translate(400 250)">
      <circle r="38" class="map__pin-ring"/>
      <circle r="7" class="map__pin-dot"/>
      <path d="M0 -60 V-14" class="map__pin-stem"/>
    </g>
    <text x="420" y="214" class="map__label">SILK ROUTE MOBILITY</text>
    <text x="24" y="476" class="map__coord">${formatCoord(company.geo.lat, company.geo.lng)}</text>
  </svg>
  <figcaption class="map__actions">
    <a class="btn" href="${mapsGoogle}" target="_blank" rel="noopener">${t.common.openGoogle} <span aria-hidden="true">↗</span></a>
    <a class="btn" href="${mapsMapy}" target="_blank" rel="noopener">${t.common.openMapy} <span aria-hidden="true">↗</span></a>
  </figcaption>
</figure>
