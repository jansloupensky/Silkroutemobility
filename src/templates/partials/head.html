<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>${e(t.pages[page.key].title)}</title>
<meta name="description" content="${e(t.pages[page.key].description)}">
${staging ? '<meta name="robots" content="noindex, nofollow">\n' : ''}${page.noindex ? '<meta name="robots" content="noindex">' : `<link rel="canonical" href="${absUrl(page.key)}">
${LANGS.map((l) => `<link rel="alternate" hreflang="${l}" href="${absUrl(page.key, l)}">`).join('\n')}
<link rel="alternate" hreflang="x-default" href="${absUrl(page.key, site.site.defaultLang)}">`}
<meta name="theme-color" content="#1E1F22">
<meta name="color-scheme" content="dark light">
<script>(function(d){var r=d.documentElement;r.classList.replace('no-js','js');try{if(sessionStorage.getItem('srm-visited'))r.classList.add('is-returning')}catch(e){}})(document)</script>
<link rel="preload" href="${asset('fonts/inter-latin-wght-normal.woff2')}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="${asset('css/main.css')}">
<link rel="icon" href="/favicon.ico?v=2" sizes="48x48">
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<link rel="manifest" href="/site.webmanifest?v=2">
<meta property="og:type" content="website">
<meta property="og:site_name" content="${e(t.meta.siteName)}">
<meta property="og:locale" content="${t.meta.locale}">
${LANGS.filter((l) => l !== lang).map((l) => `<meta property="og:locale:alternate" content="${i18n[l].meta.locale}">`).join('\n')}
<meta property="og:title" content="${e(t.pages[page.key].title)}">
<meta property="og:description" content="${e(t.pages[page.key].description)}">
<meta property="og:url" content="${absUrl(page.key)}">
<meta property="og:image" content="${site.site.url}/og-image.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Silkroute Mobility by MIEX">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="${site.site.url}/og-image.png">
${['index', 'kontakt', 'aito', 'dfsk'].includes(page.key) ? `<script type="application/ld+json">${schema()}</script>` : ''}
